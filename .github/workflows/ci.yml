name: ci
on:
  push:
    branches: [main]
    paths: ["trackit/**", "cloud/**", "k8s/**", ".github/workflows/ci.yml"]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trackit
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install checkov
      - run: checkov -d . --framework terraform,dockerfile,kubernetes --compact
  build:
    needs: [test, policy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: trackit
          push: true
          tags: |
            ghcr.io/waterman10/trackit:${{ github.sha }}
            ghcr.io/waterman10/trackit:latest