apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackit
spec:
  replicas: 3
  selector:
    matchLabels: {app: trackit}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  template:
    metadata:
      labels: {app: trackit}
    spec:
      containers:
        - name: trackit
          image: ghcr.io/waterman10/trackit:latest
          ports: [{containerPort: 8000}]
          env: [{name: APP_VERSION, value: "1.2.0"}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: trackit
spec:
  type: NodePort
  selector: {app: trackit}
  ports: [{port: 80, targetPort: 8000}]
